[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "widefield_pipeline"
version = "0.1.0"
description = "Widefield calcium-imaging preprocessing + LocaNMF spout-position decode/encode pipeline (Sabatini lab)."
requires-python = ">=3.10"
# Lower bounds only: this package LAYERS onto a prebuilt env (wfield/torch/numba/LocaNMF are
# installed separately, per the note below). Keep minimums at/below what a working wfield env
# already ships so `pip install -e` does NOT force-upgrade a functioning scientific stack, and
# do NOT cap numpy here -- numba pins the upper bound itself (numba 0.60 -> numpy<2.1 on the
# imaging computer; a newer numba on the GPU box may allow numpy>=2.1). High minimums here were
# pulling numpy 2.4 into the imaging env, which broke numba. (imaging wfield env, 2026-08:
# numpy 1.26.4, scipy 1.15.1, matplotlib 3.10, scikit-learn 1.5.2, scikit-image 0.25,
# pandas 2.2.3, joblib 1.4.2, tqdm 4.66.)
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "scikit-image>=0.22",
  "h5py>=3.8",
  "pandas>=2.0",
  "python-pptx>=0.6",
  "opencv-python>=4.8",
  "Pillow>=9",
  "joblib>=1.3",
  "tqdm>=4.64",
  "PyYAML>=6",
  "meegkit>=0.2",   # hemodynamic-correction variants (hemo_variants: meegkit_hpfit)
  "imageio-ffmpeg>=0.4",  # H.264 encoder for behavior_clip_deck. NOT optional in practice: the
                          # opencv-python build above has no H.264 encoder (avc1/H264/X264 all fail
                          # to open a writer), and its only alternative -- MPEG-4 Part 2 in an AVI --
                          # is the codec PowerPoint refuses to play. Every clip deck built before
                          # 2026-09-17 was unplayable for exactly that reason.
]
# GPU / custom builds are installed SEPARATELY (not resolvable by pip here), see README "Setup":
#   torch (CUDA build, e.g. 2.6.0+cu124), wfield==0.6.0, LocaNMF/localnmf + cuhals
#   (custom Windows build — patches in wfield_local/*.patch).

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["wfield_local*"]

[tool.ruff]
line-length = 120

# ARCHIVED CODE IS EVIDENCE, NOT SOURCE. `scripts/rest_migration/archive` holds the tests that
# guided decisions already recorded in DECISIONS.md, kept so a number can be traced to the run
# that produced it. Linting it would invite edits that make it no longer what actually ran.
# `force-exclude` so the pre-commit hook, which passes staged paths EXPLICITLY, honours it too --
# an explicit path overrides `exclude` otherwise.
extend-exclude = ["scripts/rest_migration/archive", "scripts/archive"]
force-exclude = true

[tool.ruff.lint]
# CHOSEN DELIBERATELY, 2026-09-22. Until now this table set only `line-length`, so the effective
# rule set was whatever the installed ruff defaulted to -- 1,156 findings on 0.16.2, a number that
# MOVES WHEN RUFF UPDATES and that nobody here picked. `.githooks/pre-commit` lints staged files
# against this list, so leaving it accidental means blocking commits on rules no-one chose.
#
# The test for inclusion is "would a violation be a BUG", not "is this tidier":
#
#   F     undefined names, unused imports and variables, empty f-strings. F821 is the one that
#         matters; the rest stop dead references accumulating as code moves between modules.
#
#         NEVER BULK-RUN `ruff --fix` FOR F401 IN THIS REPO. Tried 2026-09-22 across 394 files:
#         94 "unused" imports removed, and the suite went from green to 27 collection errors and
#         then to 2 failures, in two separate rounds. An import here is unused-looking for three
#         reasons, and only the first is statically visible:
#           1. RE-EXPORT via `from other import name` -- `locanmf_lick_aligned.coverage_mask` is
#              imported out of it by two files. An AST pass over ImportFrom finds these.
#           2. ATTRIBUTE ACCESS `module.name` from elsewhere. An import-graph pass misses it.
#           3. A MONKEYPATCH TARGET: `monkeypatch.setattr(pl, "out_root", ...)` names it as a
#              STRING, so no analysis of any kind can see it. `dlc_prelabel.out_root` is exactly
#              this, and removing the import turns the patch into an AttributeError.
#         F401 stays selected because on a file someone is ALREADY editing it is a fair question
#         and the author can answer it. It is not a thing to sweep.
#   B     flake8-bugbear. B023 -- a closure capturing the loop variable -- is why this is selected
#         at all: 26 live instances, and it is the same shape as the deferred-note bug in
#         `deck_layout`, where what a closure read was not what it was written next to.
#   W605  an invalid escape in a string literal is a typo Python will eventually make an error.
#   PLE   pylint's ERROR class only, not its opinions.
#   E9    syntax and IO errors.
#
# DELIBERATELY NOT SELECTED. Each fires in the hundreds on a house style that is not wrong, and a
# gate that cries wolf is a gate people learn to pass with --no-verify:
#
#   E702   1,208 hits. `a = 1; b = 2` is used throughout and reads well in numeric setup lines.
#   E741   145 hits. `l` and `I` as locals in array code.
#   I001   153 hits, AND FIXING IT HAS ALREADY DONE DAMAGE HERE: `ruff --fix I001` reordered the
#          import blocks on 2026-09-21 and destroyed the hand-written comments inside them. The
#          import groups in this repo carry prose and are maintained by hand.
#   RUF100 would flag all 322 `# noqa` comments written for rules this list does not select.
#   C408, RUF046, ISC004, RUF059, BLE001, UP031, SIM115 -- style, not defects. BLE001 in
#          particular: broad `except Exception` around a per-session step is deliberate here, so
#          one bad session cannot end a cohort run.
select = ["F", "B", "W605", "PLE", "E9"]

# B905: passing `strict=` to `zip` is a 3.10+ API preference, not a defect. 195 call sites.
ignore = ["B905"]
