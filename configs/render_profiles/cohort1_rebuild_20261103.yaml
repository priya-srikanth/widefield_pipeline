# THE cohort-1 rebuild render configuration (coordinator 11-03, Priya's decisions). ONE place for every switch the rebuild
# render runs under. Load it with `python -m wfield_local.render_profile cohort1_rebuild_20261103 --shell powershell`
# (prints the env lines) or `render_profile.apply("cohort1_rebuild_20261103")` in-process BEFORE importing analysis code
# (hemo_variants.ADOPTED is resolved at import). tests/test_render_profile.py pins the run tag this profile produces.

env:
  # Priya 11-03: the final hemo variant -- swap-masked, 415 advanced 16 ms, T refitted. NO new shared drift step.
  WIDEFIELD_HEMO_VARIANT: meegkit_hpfit_lag_refitT_swapmask
  # Priya 11-03: LocaNMF = PROJECTION of the corrected data onto the stored per-session and joint footprints (no refit).
  WIDEFIELD_LOCANMF_PROJECT: "1"
  # camera trial gate (Priya 11-03): working = contact | incomplete | jaw_only, ending at the session's last camera lick;
  # stopped = a sustained stop (>= behavior.tail_min_misses = 6 consecutive no_response)
  WIDEFIELD_TRIAL_GATE: camera
  WIDEFIELD_TRIAL_WINDOW: cue_stop
  WIDEFIELD_TRIAL_END: lick
  WIDEFIELD_TRIAL_STOPPED: run
  # LP arm: LP-TRAINED stored models (the default since 11-03; "lp" only names it -- the DAQ-trained cross-check is
  # WIDEFIELD_LP_FROZEN=daq, NOT part of this profile)
  WIDEFIELD_LP_FROZEN: lp

# THE REBUILD ROOT (coordinator 11-03, fourth review): EVERY derived output of this render -- cohort_out / grant_figures,
# figures_working, analysis_figures, LP_analysis/<run>/imaging_encoding (encoder, ITI, attempt, qc), the frozen store
# (<root>/frozen_models, fresh: FREEZE_VERSION 2 refuses the legacy store), the session cache (<root>/session_cache) and
# the RESTnl caches beside it, the map npz -- goes into this one folder. Inputs stay where they are, read-only. While
# it is set, writes outside it and reads of default derived products are REFUSED (wfield_local/rebuild_root.py).
# Seed it once: python -m wfield_local.rebuild_root init --profile cohort1_rebuild_20261103
rebuild_root: M:/MICROSCOPE/Priya/Widefield/rebuild_20261103

# Aug-only pre baseline for the DECODER blocks only: passed per render block (`--pre-from 0801`), never as a global env
# (june_august_drift refuses PRE_FROM; 12.1b lick-free rest selects its own June + August pre set).
block_args:
  epoch_grant_figures: ["--pre-from", "0801"]
  grant_figures: ["--pre-from", "0801"]

# PER-BLOCK ENV (fifth review N5b): `--block <name>` (render_profile.apply(name, block=...)) adds the block's env. The LP
# blocks set the LP lick source themselves; an LP_licks folder is refused without it (lp_licks.refuse_lp_folder).
block_env:
  lp_final_render: {WIDEFIELD_LICK_SOURCE: lp}
  restnl_maps: {WIDEFIELD_LICK_SOURCE: lp}
  epoch_accuracy: {WIDEFIELD_LICK_SOURCE: lp}
  epoch_maps: {WIDEFIELD_LICK_SOURCE: lp}
  analysis_deck_lp: {WIDEFIELD_LICK_SOURCE: lp}

# SENSITIVITY ARMS: `--arm <name>` (render_profile.apply(name, arm=...)) adds the arm's env on top; each arm's env enters
# the output tag (run_mode parts), so its outputs and caches never meet the primary ones.
arms:
  # Priya 11-03: the encoder / ITI slow-drift cutoff stays 600 s PRIMARY (combined_encoding.DRIFT_MIN_PERIOD_S);
  # 1500 s is a SENSITIVITY arm (the scheduler's six-position cycle period reaches ~22 min), rendered for the spout
  # contra - ipsi encoder cells and the ITI pre-cue level readouts only
  drift1500:
    env:
      COMBINED_ENCODING_DRIFT_MIN_PERIOD_S: "1500"
    blocks: ["encoder spout contra - ipsi cells (frozen_encoder / combined_encoding)",
             "ITI pre-cue level readouts (scripts/iti_licks.py family)"]
    expected_run_tag: hv-meegkit_hpfit_lag_refitT_swapmask_lnmfproj_drift1500s_sel-camera-cue_stop-endlick-stopRun6

# the primary encoder / ITI slow-drift cutoff (Priya 11-03): combined_encoding.DRIFT_MIN_PERIOD_S = 600 s (env unset)
notes:
  encoder_drift_cutoff_s: 600
  expected_run_tag: hv-meegkit_hpfit_lag_refitT_swapmask_lnmfproj_sel-camera-cue_stop-endlick-stopRun6
