# PROTECTED ROOTS (CLAUDE.md rule 11, Priya 2026-11-24): folders a run may only READ. Enforced by
# wfield_local/protected_roots.py through writeguard.assert_writable, figure_layout.save_png_svg and a process-wide
# audit hook (every Python-level open-for-write / mkdir / rename / remove under one of these roots is refused).
#
# A write under a protected root is allowed only when
#   - kind != frozen_store and the path lies inside a folder named in WFIELD_RUN_OUT (the run's declared NEW output
#     root; several roots separated by os.pathsep, ";" on Windows), or the active WIDEFIELD_REBUILD_ROOT;
#   - kind != frozen_store and WFIELD_ALLOW_PRODUCTION_WRITE=<reason> is set (the reason is logged, rule 11:
#     "an explicit, logged production-write decision from Priya");
#   - kind == frozen_store and WFIELD_ALLOW_FREEZE=1 (or --allow-freeze on the command line).
#
# PATHS. `share:` entries are relative to the Priya root of the MICROSCOPE share and match on every mount (M:, N:,
# the UNC form, /Volumes/Priya), so a drive-letter swap never disarms them. One glob per path segment (fnmatch).
# `local:` entries are absolute paths on this machine; "{frozen_local}" = frozen_models.local_dir().
# kinds: production | manuscript_lineage | patch | manuscript | frozen_store | superseded
#
# ADD a folder here when it is adopted as production, used as a patch (P / P2) or retired; never remove one without
# Priya's decision. tools/protected_mtime_audit.py lists files changed in these roots after a run.

