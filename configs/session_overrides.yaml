# Per-session parameter overrides, layered on configs/defaults.yaml by
# config.defaults(session="<label>"). Mirrors stroke_orofacial_pipeline's defaults+overrides
# pattern. Keys under a session are deep-merged onto the cohort defaults (only the leaves you
# name change; everything else falls through). Session label = "<animal>_<MMDD>", e.g. PS93_0807.
#
# Example (commented — no active overrides yet). Current cohort ENL (enforced-no-lick) is 2-3 s
# (gui_config timing precue_min/max 2000/3000); the default decode.precue_post_s of 2.0 s fits inside it.
# overrides:
#   PS9x_MMDD:
#     decode:
#       precue_post_s: 1.5        # shorten the pre-cue window for a session with a shorter ENL (avoid clipping)
#   PS95_0608:
#     locanmf:
#       maxrank: 25

overrides:
  # PS92 8/28: labcams saved this normal alternating 415/470 session MISLABELED single-channel
  # (pco_edge_..._1_460_480_uint16.dat). After renaming to _2_ to rescue it, the rescue relabel
  # locked exposure offset 1, which swaps the .bin's channel slots: slot 0 holds the 470 (functional)
  # frames and slot 1 the 415 (isosbestic). Motion correction is correct and is NOT redone; only SVD
  # onward must read slot 0 as functional. Flip functional_channel 1 -> 0 for this one session.
  PS92_0828:
    preprocess:
      svd:
        functional_channel: 0
