# Per-animal metadata — single source of truth. No module or notebook may redefine these.
# (Mirrors stroke_orofacial_pipeline/configs/animals.yaml conventions.)
#
# stroke_date convention: the date of the LAST PRE-STROKE session. The VLS
# (ventrolateral-striatal) stroke is induced after that day's session; sessions on
# stroke_date are baseline, only sessions AFTER are post-stroke. The cohort is currently
# PRE-STROKE, so stroke_date is null (to be filled when the lesion is done).
#
# characteristics: free-form per-animal traits the analysis conditions on.
# exclude: dates (MMDD) to drop, optionally scoped to an analysis tag (see docs).

animals:
  PS92:
    color: "tab:blue"
    sex: F
    date_of_birth: 2026-01-14
    genotype: "Thy1-GCaMP6s GP4.3"
    characteristics: {}
    stroke_date: null
    stroke_laterality: "L"          # planned VLS lesion side (not yet induced)
    stroke_laser_power_mW: null     # fill at lesion time
    reference_landmarks: v2         # dorsal_cortex_landmarks_<v> version for the 6/6 cross-reg reference
    exclude: []

  PS93:
    color: "tab:red"
    sex: F
    date_of_birth: 2026-01-14
    genotype: "Thy1-GCaMP6s GP4.3"
    characteristics:
      orofacial_deficit: right   # tongue deviates right, minimal right whisking
      cortical_signature: "SSp-left << SSp-right (lateralized); natural positive control for lesion-style L/R asymmetry"
    stroke_date: null
    stroke_laterality: "L"          # planned VLS lesion side (not yet induced)
    stroke_laser_power_mW: null     # fill at lesion time
    reference_landmarks: v2
    exclude: []

  PS94:
    color: "tab:orange"
    sex: F
    date_of_birth: 2025-12-24
    genotype: "Thy1-GCaMP6s GP4.3"
    characteristics: {}
    stroke_date: null
    stroke_laterality: "L"          # planned VLS lesion side (not yet induced)
    stroke_laser_power_mW: null     # fill at lesion time
    reference_landmarks: v1
    exclude: []

  PS95:
    color: "tab:green"
    sex: M
    date_of_birth: 2025-12-24
    genotype: "Thy1-GCaMP6s GP4.3"
    characteristics: {}
    stroke_date: null
    stroke_laterality: "L"          # planned VLS lesion side (not yet induced)
    stroke_laser_power_mW: null     # fill at lesion time
    reference_landmarks: v1
    exclude: []

# Cohort-level date policy (baseline days). MMDD dates are QUOTED strings — unquoted leading-zero
# values like 0606 are parsed as octal by YAML (0606 -> 390), and 0808 would be invalid octal.
date_policy:
  # The CURATED "good" set used for every cross-session comparison (decode/encode across sessions,
  # cross-mouse, within-animal, RSA/crossnobis) is DERIVED, not listed: it is every date registered in
  # sessions.yaml minus the exclusions below (config.curated_dates()). Decided 2026-08-08: 6/6-6/8 +
  # 8/6 onward -- which is an emergent property of that rule, so each new night joins automatically.
  #
  # There used to be literal `all_registered` and `cross_session` lists here as well. They were
  # hand-maintained, both stopped at 8/7, and nothing kept them honest: the deck builder read
  # `cross_session` for its standalone default, so running it by hand silently produced a 5-date deck
  # while the nightly (which derives the set) produced a 9-date one. Removed 2026-08-13 -- the rule is
  # the single source of truth, and there is now no stale list to read by accident.
  #
  # Excluded from cross-session: noisy/low-engagement early June (6/1-6/5) and the wonky 8/5.
  cross_session_exclude: ["0601", "0602", "0603", "0604", "0605", "0805"]
