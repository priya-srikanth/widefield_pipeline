# Per-animal metadata — single source of truth. No module or notebook may redefine these.
# (Mirrors stroke_orofacial_pipeline/configs/animals.yaml conventions.)
#
# stroke_date convention: the date of the LAST PRE-STROKE session. The VLS
# (ventrolateral-striatal) stroke is induced after that day's session; sessions on
# stroke_date are baseline, only sessions AFTER are post-stroke. The cohort is currently
# PRE-STROKE, so stroke_date is null (to be filled when the lesion is done).
#
# characteristics: free-form per-animal traits the analysis conditions on.
# exclude: dates (MMDD) to drop, optionally scoped to an analysis tag (see docs).

animals:
  PS92:
    color: "tab:blue"
    genotype: null            # TODO: fill from cohort records
    characteristics: {}
    stroke_date: null
    exclude: []

  PS93:
    color: "tab:red"
    genotype: null
    characteristics:
      orofacial_deficit: right   # tongue deviates right, minimal right whisking
      cortical_signature: "SSp-left << SSp-right (lateralized); natural positive control for lesion-style L/R asymmetry"
    stroke_date: null
    exclude: []

  PS94:
    color: "tab:orange"
    genotype: null
    characteristics: {}
    stroke_date: null
    exclude: []

  PS95:
    color: "tab:green"
    genotype: null
    characteristics: {}
    stroke_date: null
    exclude: []

# Cohort-level date policy (baseline days). MMDD dates are QUOTED strings — unquoted leading-zero
# values like 0606 are parsed as octal by YAML (0606 -> 390), and 0808 would be invalid octal.
date_policy:
  all_registered: ["0601", "0602", "0603", "0604", "0605", "0606", "0607", "0608", "0805", "0806", "0807"]
  # CURATED "good" set used for all cross-session comparisons (decode/encode across sessions,
  # cross-mouse, within-animal, RSA/crossnobis). Decided 2026-08-08: 6/6-6/8 + 8/6 onward.
  cross_session: ["0606", "0607", "0608", "0806", "0807"]     # + future dates 8/8, 8/9, ...
  # Excluded from cross-session: noisy/low-engagement early June (6/1-6/5) and the wonky 8/5.
  cross_session_exclude: ["0601", "0602", "0603", "0604", "0605", "0805"]
