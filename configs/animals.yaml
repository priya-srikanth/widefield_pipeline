# Per-animal metadata — single source of truth. No module or notebook may redefine these.
# (Mirrors stroke_orofacial_pipeline/configs/animals.yaml conventions.)
#
# stroke_date convention: the date the VLS (ventrolateral-striatal) lesion was INDUCED.
# Sessions on or before it are baseline; only sessions AFTER it are post-stroke. (The
# lesion follows that day's session, so a same-day recording is still pre-stroke.)
# Corrected 2026-08-17: this previously read "the date of the LAST PRE-STROKE session",
# which conflates the lesion with the recording schedule -- they differ here (last session
# 8/14, lesion 8/16) and only the lesion date is a fact about the experiment.
#
# COHORT LESION DATES DIFFER. PS94/PS95: 2026-08-16 PM at 3 mW, deficit -> stroke_date 20260816.
# PS92/PS93: the 8/16 PM attempt did NOT take, redone 2026-08-17 after that session at 3.75 and
# 5.5 mW -> stroke_date 20260817, with 0817 EXCLUDED (neither phase). stroke_cutoff() is the
# EARLIEST date across the cohort (0816), so pooled pre-stroke references stay safe for everyone.
# Last pre-stroke
# session was 8/14 (no recordings 8/15-8/16), so the phase split is the same either way
# here -- but the lesion date is the one that stays true if a same-day session is ever run. PS94 and PS95 took at 3 mW and show overt deficits ->
# 8/17 onward is post-stroke for them. PS92 and PS93 showed NO overt deficit and are being
# re-lesioned after the 8/17 session, so their 8/17 is neither baseline nor post-stroke and is
# listed in `exclude` (config.session_phase -> "excluded"). Per-session figures still show it;
# it is invisible to every POOLED phase set.
#
# READ BY config.stroke_date / stroke_cutoff / session_phase / phase_labels since 2026-08-17.
# Before that this field, and `exclude`, were documented here and consumed by NOTHING -- so
# curated_dates() would have swept a post-stroke night into the pre-stroke pool that fits the
# joint bases, trains the frozen decoder and builds the no-lick reference.
#
# characteristics: free-form per-animal traits the analysis conditions on.
# exclude: dates (MMDD) to drop, optionally scoped to an analysis tag (see docs).
#
# epochs: recovery-stage boundaries in DAYS SINCE stroke_date (not session index -- sessions are
#   not daily, and the two disagree; see wfield_local/epochs.py). Read by config.epoch_spec().
#
#   ALL THREE are DERIVED from behaviour on every nightly run (Priya, 2026-09-07) and published to
#   `epoch_boundaries.json` beside the deck; THAT file is what the figures were built on, and it is
#   also what a crashed or behaviour-less run falls back to. The values written HERE are a seed and
#   a pinned reference, used only under WIDEFIELD_EPOCHS_PINNED=1 or when no artifact exists at all
#   (a fresh clone, or a box that has never run). They can therefore sit stale for a while without
#   affecting nightly output -- the nightly reports the divergence and prints the lines to paste.
#
#   THE PIPELINE NEVER WRITES THIS FILE, deliberately: it is version-controlled and both machines
#   push main, so a nightly rewriting it would race and conflict; and a YAML dump would destroy the
#   hand-written comments that are most of this file's value. When derivation and this block
#   disagree the nightly logs the exact line to paste here, and a human promotes it.
#
#   acute: [first, last] inclusive. subacute_from / chronic_from: first day of that epoch, or null
#   for chronic to assert "tested against the rule, has not stabilised" -- an ABSENT key would read
#   as "nobody has looked", which is a different claim.

animals:
  PS92:
    color: "tab:blue"
    sex: F
    date_of_birth: 2026-01-14
    genotype: "Thy1-GCaMP6s GP4.3"
    characteristics: {}
    stroke_date: 20260817   # EFFECTIVE VLS lesion, done AFTER the 8/17 session
                            #   (Priya, 2026-08-18). The 8/16 PM attempt produced no overt
                            #   deficit and is NOT the stroke date. 8/17 is excluded below:
                            #   the lesion followed that recording, but the animal had
                            #   already been lasered once, so it is neither a clean
                            #   baseline nor post-stroke.
    stroke_laterality: "L"          # planned VLS lesion side (not yet induced)
    stroke_laser_power_mW: 3.75     # EFFECTIVE lesion, 2026-08-17 after that session
                             #   (Priya, 2026-08-18). Higher than PS94/PS95 (3 mW), which
                             #   is why it took where the 8/16 PM attempt did not; that
                             #   earlier attempt's power was never recorded.
    reference_landmarks: v2         # dorsal_cortex_landmarks_<v> version for the 6/6 cross-reg reference
    epochs:                         # days since stroke_date; see the note above
      acute: [1, 5]
      subacute_from: 7
      chronic_from: 11    # derived 2026-09-07
    exclude: ["0817"]        # NEITHER baseline nor post-stroke: the 8/16 PM
                             #   attempt gave no deficit, and the EFFECTIVE
                             #   lesion followed this same 8/17 session. Load-
                             #   bearing -- without it session_phase resolves
                             #   8/17 to "pre" (stroke_date session = baseline)
                             #   and it would enter the pre-stroke reference.
                             #   KEEP when these animals become post-stroke.
                             #   Per-session figures still show it; Section G
                             #   uses it as the NEGATIVE CONTROL, which is why
                             #   it must stay analysable but unpoolable.

  PS93:
    color: "tab:red"
    sex: F
    date_of_birth: 2026-01-14
    genotype: "Thy1-GCaMP6s GP4.3"
    characteristics:
      orofacial_deficit: right   # tongue deviates right, minimal right whisking
      cortical_signature: "SSp-left << SSp-right (lateralized); natural positive control for lesion-style L/R asymmetry"
    stroke_date: 20260817   # EFFECTIVE VLS lesion, done AFTER the 8/17 session
                            #   (Priya, 2026-08-18). The 8/16 PM attempt produced no overt
                            #   deficit and is NOT the stroke date. 8/17 is excluded below:
                            #   the lesion followed that recording, but the animal had
                            #   already been lasered once, so it is neither a clean
                            #   baseline nor post-stroke.
    stroke_laterality: "L"          # planned VLS lesion side (not yet induced)
    stroke_laser_power_mW: 5.5     # EFFECTIVE lesion, 2026-08-17 after that session
                             #   (Priya, 2026-08-18). Higher than PS94/PS95 (3 mW), which
                             #   is why it took where the 8/16 PM attempt did not; that
                             #   earlier attempt's power was never recorded.
    reference_landmarks: v2
    epochs:                         # days since stroke_date; see the note above
      acute: [1, 4]
      subacute_from: 5
      chronic_from: null    # has not stabilised
    exclude: ["0817"]        # NEITHER baseline nor post-stroke: the 8/16 PM
                             #   attempt gave no deficit, and the EFFECTIVE
                             #   lesion followed this same 8/17 session. Load-
                             #   bearing -- without it session_phase resolves
                             #   8/17 to "pre" (stroke_date session = baseline)
                             #   and it would enter the pre-stroke reference.
                             #   KEEP when these animals become post-stroke.
                             #   Per-session figures still show it; Section G
                             #   uses it as the NEGATIVE CONTROL, which is why
                             #   it must stay analysable but unpoolable.

  PS94:
    color: "tab:orange"
    sex: F
    date_of_birth: 2025-12-24
    genotype: "Thy1-GCaMP6s GP4.3"
    characteristics: {}
    stroke_date: 20260816   # date the VLS lesion was INDUCED (8/16 PM)
    stroke_laterality: "L"          # planned VLS lesion side (not yet induced)
    stroke_laser_power_mW: 3       # VLS lesion 2026-08-16 PM; overt deficit -> POST-stroke
                             #   from 8/17 (Priya, 2026-08-17)
    reference_landmarks: v1
    epochs:                         # days since stroke_date; see the note above
      acute: [1, 7]
      subacute_from: 9
      chronic_from: null    # has not stabilised
    exclude: []

  PS95:
    color: "tab:green"
    sex: M
    date_of_birth: 2025-12-24
    genotype: "Thy1-GCaMP6s GP4.3"
    characteristics: {}
    stroke_date: 20260816   # date the VLS lesion was INDUCED (8/16 PM)
    stroke_laterality: "L"          # planned VLS lesion side (not yet induced)
    stroke_laser_power_mW: 3       # VLS lesion 2026-08-16 PM; overt deficit -> POST-stroke
                             #   from 8/17 (Priya, 2026-08-17)
    reference_landmarks: v1
    epochs:                         # days since stroke_date; see the note above
      acute: [1, 1]
      subacute_from: 2
      chronic_from: 11      # ratified 2026-09-10 (hit plateau d11 @101%, licks plateau d9 @113%)
    exclude: []

# Cohort-level date policy (baseline days). MMDD dates are QUOTED strings — unquoted leading-zero
# values like 0606 are parsed as octal by YAML (0606 -> 390), and 0808 would be invalid octal.
date_policy:
  # The CURATED "good" set used for every cross-session comparison (decode/encode across sessions,
  # cross-mouse, within-animal, RSA/crossnobis) is DERIVED, not listed: it is every date registered in
  # sessions.yaml minus the exclusions below (config.curated_dates()). Decided 2026-08-08: 6/6-6/8 +
  # 8/6 onward -- which is an emergent property of that rule, so each new night joins automatically.
  #
  # There used to be literal `all_registered` and `cross_session` lists here as well. They were
  # hand-maintained, both stopped at 8/7, and nothing kept them honest: the deck builder read
  # `cross_session` for its standalone default, so running it by hand silently produced a 5-date deck
  # while the nightly (which derives the set) produced a 9-date one. Removed 2026-08-13 -- the rule is
  # the single source of truth, and there is now no stale list to read by accident.
  #
  # Excluded from cross-session: noisy/low-engagement early June (6/1-6/5) and the wonky 8/5.
  cross_session_exclude: ["0601", "0602", "0603", "0604", "0605", "0805"]
