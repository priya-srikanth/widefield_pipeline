# Default analysis parameters (cohort-wide). Per-session overrides -> configs/sessions.yaml.
# (Mirrors stroke_orofacial_pipeline/configs/defaults.yaml.)

# Preprocessing cross-session deck (wfield_local/preprocess_deck.py). To bound file size, the deck
# is split into multiple .pptx files packing WHOLE animals (never splitting an animal's dates across
# files) until a file would exceed max_sessions_per_file. cap 10 -> ~one deck per animal now.
deck:
  max_sessions_per_file: 10     # 0/null = single unified deck regardless of size

# Preprocessing (IMAGING box): motion(fixed) -> SVD -> cross-register -> push. Consumed by
# wfield_local/preprocess.py (replaces the retired per-date _nightly_<DATE>.py drivers).
preprocess:
  reference_date: "0606"        # cross-register each session to this date's per-animal reference
                                # (reference session dir derived from sessions.yaml 0606 entry;
                                #  per-animal landmark version = animals.yaml reference_landmarks)
  xall_min_date: "0605"         # task-era cutoff (MMDD): the all-days 'xall' cross-day QC overlay
                                # spans registered sessions >= this date (excludes 6/1-6/4 baseline)
  relabel_mode: rescue          # motion correct: drop dark inter-trial frames (continuous saving)
  motion_mode: "2d"             # run_wfield_motion --mode
  svd:
    k: 100
    functional_channel: 1       # 470 functional half of each 415/470 pair
    fs: 31.23
    freq_highpass: 0.1
    freq_lowpass: 14.0
  push_frame_map_globs:         # copied to MICROSCOPE alongside wfield_local_results (NOT the .bin)
    - "*cleanpairs_frame_map.npz"
    - "*cleanpairs_summary.json"
    - "motion_correction_*"
  maps:                         # cue/lick/quiet activity-MAPS pass (wfield_local/preprocess.py
                                # generate_maps); reproduces the retired _maps_behavior_run.py chain.
    tag: affine8v1              # allen_aligned_<tag> + spout_trial_averages_<tag>/lick_aligned_<tag>/quiet_<tag>
    cue_pre_s: 2.0              # cue map pre/post window (framemap_event_maps --what cue)
    cue_post_s: 2.0
    lick_post_s: 0.15           # lick map post window (framemap_event_maps --what lick, 150ms)

# Which hemodynamic/drift-removal variant every ANALYSIS reads (docs/PREPROCESSING_DECISION.md).
# `zerophase` (or null) = the original bare wfield_local_results/SVTcorr.npy; anything else resolves to
# wfield_local_results/hemo_<variant>/SVTcorr.npy. Flip to meegkit_hpfit only once EVERY session in the
# curated set has that directory built -- a half-built flip would silently mix two variants across
# sessions, which is the exact failure the naming rule exists to prevent.
hemo:
  variant: meegkit_hpfit    # ADOPTED 2026-08-14; flipped once all 37 curated sessions had the dir
  # The variant PREPROCESS BUILDS for every new session (step 3b). Deliberately separate from
  # `variant` above: the build must run on every night from now on, while reads stay on zerophase
  # until every curated session has the directory. Set to none/zerophase to disable the build.
  build_variant: meegkit_hpfit

locanmf:
  r2_thresh: 0.95
  loc_thresh: 80
  maxrank: 20
  allen_dir_name: allen_aligned_affine8v1     # wfield_local_results/<this>/U_atlas.npy (+ ../../SVTcorr.npy)
  output_dir_name: locanmf_affine8v1_hemo_meegkit_hpfit   # NAMES the hemodynamic variant the
  # decomposition was fitted to (docs/PREPROCESSING_DECISION.md). Flipped 2026-08-14 once the
  # refit covered 52/52 sessions. The zerophase decomposition is NOT deleted -- it sits in
  # locanmf_affine8v1_hemo_zerophase, so any pre-14-Aug result stays reproducible.

decode:
  aligns: [lick, cue, precue]
  lick_post_s: 2.0        # first-lick window (empirical optimum; spans the lick bout)
  cue_post_s: 2.0
  precue_post_s: 2.0      # pre-cue (ENL) window, motor-independent readout (2 s = the maintained-code
                          # window; a few sessions with a shorter ENL may clip — override per session)
  # Sub-bins per feature window: the decoder sees a TIME COURSE over the window, not one mean.
  # PRE-CUE, RE-MEASURED ON ALL 44 CURATED SESSIONS (2026-08-17): the gain is +0.009, better in
  # 23/44 -- a coin flip, NOT the +0.032 the 16-session pilot reported. roll2x1.0 is nominally best
  # (+0.016, 28/44) but that is the max of six arms scored on the same sessions, so the margin is
  # partly selection. Treat pre-cue sub-binning as UNESTABLISHED; precue: 4 is kept only because
  # changing it would move every pre-cue number again for no demonstrated gain.
  # Post-cue (+0.020) and post-lick (+0.023) are still the 16-session pilot values -- NOT re-run.
  # Width matters only post-lick, where 0.25 s wins (+0.009, 12/16). 1 = the pre-2026-08-14 mean.
  # 2.0 s window: precue/cue 4 -> 0.5 s bins, lick 8 -> 0.25 s bins. See DECISIONS.md.
  bins:
    precue: 4
    cue: 4
    lick: 8
  # THE HEADLINE PRE-CUE NUMBER IS LICK-FREE (Priya, 2026-08-17). The 2 s window ending at the
  # cue slides earlier to the latest lick-free gap when a lick falls in it (bounded at the
  # spout strobe), and a trial with no clean window anywhere is DROPPED. Previously only the
  # Section C control restricted; the headline relied on the ENL keeping the window quiet,
  # which it does 90.8-99.5% of the time -- but PS93 8/9 falls to 76%, in the animal whose
  # licking is already atypical. Set false to recover the pre-2026-08-17 behaviour.
  precue_lickfree: true
  max_rt_s: 3.5           # engaged = first lick within this of the cue; else -> no-lick.
                          # 3.5 s = the task's REAL response window (gui_config.json
                          # timing.response_window), so 'engaged' now means the same thing
                          # here as in the behaviour pipeline's hit/miss. At 2.0 s the
                          # no-lick arm CONTAINED the late-but-rewarded trials -- 39.3% of
                          # it for PS92 and 33.9% for PS93 -- so those slides reported a
                          # late-lick effect as a no-lick effect (Priya, 2026-08-21).
                          # Safe for the lick window: the window starts at the first lick
                          # wherever it falls, and 3.5 + 2.0 = 5.5 s sits inside the
                          # minimum measured cue-to-cue interval of 8.0 s.
  cv: block               # GroupKFold by ~6-trial position blocks (no per-trial baseline)
  baseline: none
  chance: 0.167           # 6 positions

encode:
  model: ridge            # position -> component activity; FEVE = captured / explainable (ceiling)

cross_session:
  from_dates: curated     # 6/6-6/8 + 8/6 onward (see animals.yaml date_policy.cross_session);
                          # excludes noisy early June (6/1-6/5) and the wonky 8/5
  tag: "0606-<latest>"    # first..latest of the curated set

rsa:
  metric: crossnobis      # noise-unbiased distances (the honest cross-day / pre-post metric)
  also_correlation: true  # 1 - Pearson RDM shown alongside, clearly labeled

lick_detection:            # DAQ lick_analog (ai0) — shared by behavior + imaging (single source)
  thresh_upper: 2.5
  thresh_lower: 0.5
  lockout_falling_edge_s: [0.001, 0.020]
  min_ili_ms: 40           # physiological lick floor: ILI < this = double-detection artifact, dropped.
                           #   Empirically these mice lick 5-7 Hz (median ILI 145-194 ms), peaking ~9-11 Hz
                           #   (PS95 fastest, ILI down to ~90 ms); a 40 ms floor (25 Hz) removes only 0-3
                           #   impossible sub-40 ms doubles per session and keeps ALL real fast licks, while
                           #   a 100 ms cut would clip the fastest real licking. The offset-locked lockout
                           #   alone leaves a ~13 ms floor; this enforces the real one. Applied as
                           #   max(min_ili, refractory) so imaging's 0.1 s bout-collapse already subsumes
                           #   it (no change to lick-aligned maps); behavior/microstructure gets the floor.

# Spout behavior-session figures (wfield_local.spout_behavior; 1 cue + 6 spout positions).
# The task-controller trials.csv already scores hit/miss/lick_in_response_window per trial;
# these params only govern the engagement gate + latency, NOT lick re-detection.
behavior:
  free_reward_excluded: true      # drop free-reward (non-scored) trials from accuracy
  # latency_max_s RETIRED 2026-09-08. It was a SECOND response window (5.0 s) beside the task's
  # real one (3.5 s, read per session from gui_config.json), so a lick made after the window
  # closed -- while the spout was already returning to dock -- was reported as that trial's
  # response latency on a trial scored a MISS. First-lick latency now comes from the same
  # `latency_s` the trial table scores hit/miss with. See spout_behavior.first_lick_latency_s.
  min_session_trials: 20          # skip near-empty aborted runs (fewer scored trials than this)
  engagement:                     # separate a sated/disengaged tail from genuine spatial inaccuracy
    window_trials: 15             # trailing window for the rolling response (lick-in-window) rate
    min_response_rate: 0.5        # rolling rate below this = disengaged (misses here are NOT "inaccurate")
    tail_min_misses: 6            # >= this many trailing consecutive non-responses = satiation tail
                                  #   (matches the task's auto_hold_after_miss_threshold)
    min_engaged_trials: 5         # positions with fewer engaged trials are reported but greyed out
  licking:                        # lick microstructure (from events.csv lick_on, device clock)
    peri_cue_window_s: [-2.0, 3.0]  # raster/PSTH window around cue (negative = anticipatory/pre-cue)
    # FALLBACK ONLY for trial scoring: the real window is read PER SESSION from that session's
    # gui_config.json (timing.response_window, ms) -- the task has run 3500 ms, never 2.0 s. This
    # value is still the window for the per-trial lick COUNT/RATE metrics (matches decode lick_post_s)
    # and is used for hit/miss only when a session has no gui_config.json. See docs/GUI_TRIALS_LOGGING.md.
    response_window_s: 2.0
    max_ili_ms: 300               # inter-lick interval that splits lick bouts (stroke_orofacial default)
    min_bout_licks: 2             # drop bouts with fewer licks than this
    psth_bin_ms: 100              # peri-cue PSTH bin width
    compare_daq: true             # overlay our DAQ lick_detection pipeline (lick_detection.min_ili_ms
                                  #   floor applied) when the session .h5 is found

# Canonical DAQ behavior-event segmentation (wfield_local.behavior_events): identify licks / rewards /
# running bouts / quiet periods / grooming ONCE per session from the DAQ, so every consumer (behavior +
# imaging) loads the same events instead of re-detecting. Licks use lick_detection.* (thresholds + floor).
# !! params below (treadmill calibration, running/quiet/grooming) are stroke-pipeline starting points --
# TUNE for this rig once DLC/FaceRhythm movement gives ground truth (mirrors quiet_periods.py caveat).
segmentation:
  treadmill:
    channel: treadmill
    offset_v: 1.2587643276652853
    volt_sec_per_rot: 0.382
    mm_per_rot: 29.25
    smoothing_sigma_s: 0.15
  running:                        # find_running_bouts (treadmill): sustained locomotion
    thresh_speed_mm_s: 3.0        # sits above the rest floor (p90~0.2) and below the movement tail
                                  #   (p99~4.5-11); 3 (vs orofacial's 5) ~doubles running frames for these
                                  #   sedentary mice -> better activity-map SNR. Quiet stays <1 -> 1-3 gap.
    max_gap_s: 0.3
    min_duration_s: 2.0
  quiet:                          # slow + not-near-lick/reward, buffered (F0 baseline candidate)
    speed_mm_s: 1.0
    min_quiet_s: 0.5
    treadmill_buffer_s: [3.0, 3.0]
    lick_buffer_s: [1.0, 3.0]
    reward_buffer_s: [0.1, 8.0]
  reward:
    channel: reward_ttl
    thresh_v: 2.5
  grooming:                       # single-spout long-contact proxy (EXPERIMENTAL; ~0 events pre-stroke,
    enabled: false                #   no bilateral spout to confirm -- keep OFF until validated post-stroke)
    contact_thresh_v: 2.5
    max_contact_s: 0.4            # spout contact longer than a lick (~65-95 ms) -> candidate paw/groom
    buffer_s: [6.0, 6.0]

# Spout-position source + sync (see STROBE_BIT1_RECOVERY.md, wfield_local/frame_sync.py):
#  - positions from DAQ spout-strobe bits (code = bit0 + 2*bit1 + 4*bit2)
#  - when a strobe bit is dead (Aug-2026), recover from the behavior-log pos_idx
#    (order + bitmask, >=98% match) or, if the log is empty, from cam1 video (sync-pulse aligned)
sync:
  daq_sample_rate_hz: 5000
  daq_sync_line: 0            # DAQ digital line0 rising edges == camera CSV col3 LSB rising edges
  behavior_starts_after_daq: true   # align by sync pulses / trial-offset, NOT wall-clock (drift-free)
  strobe_bits: {bit0: 4, bit1: 5, bit2: 6}   # DAQ digital lines encoding spout position

dlc:                          # DeepLabCut orofacial tracking on the WIDEFIELD rig. The earlier
                              # 2pRAM cohort's project (MICROSCOPE/Priya/DeepLabCut/DLC_train_config)
                              # is the weight donor, not the predictor -- see DECISIONS.md
                              # "DLC on the widefield rig". Survey the calibration before trusting
                              # any of this: python -m wfield_local.dlc_calibration
  cameras:                    # EACH VIEW DECLARES WHAT IT CAN ACTUALLY SEE (Priya, 2026-09-08).
                              # Not one shared list: cam1 looks UP from below and has no nose or
                              # identifiable whiskers, and a side view has only one side's. Labels
                              # for a part a camera cannot see are not merely wasted -- they are
                              # invented, and a network trained on them learns to hallucinate.
                              #
                              # NAMES ARE SHARED WHERE THE VIEWS OVERLAP, which is what makes 3D
                              # possible: triangulation matches keypoints by name. jaw / tongue /
                              # spout appear in ALL FOUR views, so those are the parts that can be
                              # reconstructed cohort-wide. Whiskers pair cam4 with one side view;
                              # `nose` is cam4 only and so stays 2D.
    cam4:
      role: front             # the nearest analogue of the old `video2`
      bodyparts: [nose, jaw, tongue,
                  L_whiskers_1, L_whiskers_2, L_whiskers_3,
                  R_whiskers_1, R_whiskers_2, R_whiskers_3,
                  spout]
    cam1:
      role: bottom            # looks UP at the underside of the snout; the spout enters from the
                              # top of frame. The nose (dorsal, nostrils) is not in view at all and
                              # the whiskers, while visible, cannot be identified as the frontal
                              # view's numbered points. Best view of the tongue there is.
      bodyparts: [jaw, tongue, spout]
    cam2:
      role: side_left         # sees the animal's LEFT side (Priya, 2026-09-08)
      bodyparts: [L_eye, jaw, tongue,
                  L_whiskers_1, L_whiskers_2, L_whiskers_3,
                  spout]
    cam3:
      role: side_right        # sees the animal's RIGHT side -- so this is the view that carries
                              # PS93's right orofacial deficit, and the laterality above is not a
                              # cosmetic label.
      bodyparts: [R_eye, jaw, tongue,
                  R_whiskers_1, R_whiskers_2, R_whiskers_3,
                  spout]

                              # `spout`: ONE spout that MOVES across 6 positions, vs the old rig's
                              # fixed L_spout/R_spout. NOT split into spout_tip/spout_base -- two
                              # points would give the spout's axis as well as its position, which
                              # is worth having, but it is a new measurement rather than a port and
                              # should be decided as one.
                              # The EYES survive only on the side views. They are out of frame on
                              # cam4 and cam1, where the donor still returns them at 0.44-0.79 in
                              # the top corners. They were the CENTERING FIDUCIAL in the old
                              # pipeline, not a result; the replacement is the 3D world frame,
                              # which head fixation makes static without any fiducial at all.
  frames:                     # labelling-set extraction (wfield_local/dlc_frames.py)
    per_session: 24           # = 6 spout positions x 4 within-trial phases, one frame per cell.
                              # Small per session on purpose: coverage comes from spanning animals
                              # and EPOCHS, not from many frames of one session. A network
                              # labelled only pre-stroke degrades exactly where the result lives --
                              # the 2pRAM cohort saw post-stroke tongue tracking fall apart in its
                              # two severe animals.
    phases:                   # seconds from the DAQ cue rising edge; the window matches
                              # behavior_clips (-1.0 s to +3.5 s), so a labelled frame is always
                              # inside a window that has an example clip.
      ENL: -0.60              # spout in position, before the cue: mouth closed, whiskers free
      Cue: 0.05               # within the 100 ms cue pulse
      early: 0.40             # first licks -- where the tongue is out and worth labelling
      late: 1.50              # into the response window; consummatory licking or a failed attempt
    lick_per_session: 6       # DAQ lick ONSETS sampled per session, one per spout position. Each
                              # yields one frame per entry of lick_offsets_s below, so the frame
                              # count is lick_per_session x len(lick_offsets_s) = 36.
                              # Fixed cue offsets are the wrong instrument for the tongue: scored
                              # against DAQ licks, only 8 of 96 ground-truthed frames landed within
                              # 40 ms of a lick, because a mouse at 5-7 Hz has its tongue out ~15
                              # frames in 40. The tongue is therefore under-represented in the set
                              # by construction, which is a labelling-set problem and not a network
                              # one. The lick sensor fires on tongue-SPOUT CONTACT, so a frame at a
                              # lick onset is a frame with the tongue out, by measurement.
    lick_offsets_s:           # WHERE IN THE LICK CYCLE, measured rather than assumed (2026-09-08).
                              # Rendering PS94 licks at 12 ms steps from -28 to +84 ms shows the
                              # tongue is still IN for most of the pre-onset half, emerges around
                              # the onset, is broadest and best separated from the spout at
                              # +24..+48 ms, and is retracting by +72..+84 ms. A symmetric +/-28 ms
                              # window (Priya's first suggestion) therefore spends half its frames
                              # before the tongue appears and stops before the peak.
      - -0.016                #   tongue still in or just emerging: the negative/edge case, so the
                              #   network learns when NOT to fire as well as when to
      - 0.0                   #   contact
      - 0.016                 #   protruding
      - 0.032                 #   near peak extension
      - 0.048                 #   peak, well clear of the spout
      - 0.064                 #   beginning to retract
    seed: 92                  # frame choice is deterministic, so a re-run re-picks the SAME frames
                              # rather than quietly growing a second labelling set.
  board:                      # The ChArUco calibration board (wfield_local/dlc_board.py).
                              # SIZED FROM THE 08-05 RECORDING, not from paper: in cam2 the printed
                              # pattern spans ~145 px while the card it is taped to -- a 30 mm cage
                              # plate, 38.1 mm -- spans ~390 px, so the markers in use are about
                              # 1.2 mm and resolve to 2.1 px per code cell. A DICT_4X4 marker is 6
                              # cells across and stops decoding below ~3, which is exactly why the
                              # side views see the board and cannot read it.
    squares_x: 9
    squares_y: 7
    square_mm: 10.5
    marker_mm: 8.0            # ~7x the current 1.2 mm -> ~14 px/cell on cam2 at the same working
                              # distance. Comfortable margin over the ~3 needed WITHOUT outgrowing
                              # the rig: a full-page board would be ~20x, and cam4 -- whose field is
                              # the snout alone -- would see two squares of it.
    dictionary: DICT_4X4_50   # matches the board already in use, so dlc_calibration is unchanged
    paper: a4                 # 94x74 mm board, about 2.5x the cage plate it mounts on
                              # THESE FOUR NUMBERS ARE THE METRIC SCALE of every 3D reconstruction
                              # and are not recoverable from video, which is why dlc_board prints
                              # them onto the board itself along with a 100 mm ruler.

  donor:                      # The 2pRAM network, used as a PRE-LABELLER (and later as training
                              # weights). READ-ONLY: a local copy is made, the original is never
                              # touched. ResNet-50 group-norm + HeatmapHead, 13 bodyparts, test
                              # RMSE 2.70 px on ITS OWN view.
    project: "N:/MICROSCOPE/Priya/DeepLabCut/DLC_train_config"
    local_copy: "E:/dlc_donor_probe/DLC_train_config"
    shuffle: 5
    trainingsetindex: 0
    snapshot: snapshot-best-060.pt
    conversion:               # For TRAINING (DLC 3.x weight init), which is strictly 1:1 -- one
                              # donor bodypart per target. Distinct from `prelabel.spout_from`,
                              # which may merge two donor channels because seeding a label is not
                              # constrained the way initialising a head channel is.
      nose: nose
      jaw: jaw
      tongue: tongue
      L_whiskers_1: L_whiskers_1
      L_whiskers_2: L_whiskers_2
      L_whiskers_3: L_whiskers_3
      R_whiskers_1: R_whiskers_1
      R_whiskers_2: R_whiskers_2
      R_whiskers_3: R_whiskers_3
      spout: R_spout          # R, not L: it clears 0.6 on 53% of frames against L's 23%, and covers
                              # far_R..close_L while L covers only close_center..far_L.
                              # (L_eye, R_eye, and the unused donor spout have no target and are
                              #  dropped -- their head channels are re-initialised.)

  prelabel:                   # Run the donor over the extracted frames and seed DLC's labels with
                              # what it gets right, so labelling is CORRECTION rather than blank-page
                              # work. Measured on the 312 cam4 frames, 2026-09-08 -- see DECISIONS.md.
    scale: 0.45               # THE WHOLE TRICK. DLC does not rescale at inference and cam4 is ~2.5x
                              # more zoomed than the donor's view, so at native scale the nose is
                              # found on 8% of frames. At 0.45 it is found on 97%. Swept
                              # 1.0/0.6/0.45/0.35/0.28; 0.45 and 0.60 are close, 0.45 wins on nose.
    scale_overrides:          # NOT every part prefers the same apparent size. Scored against DAQ
                              # lick onsets -- an objective "is the tongue out?" the network never
                              # saw -- the tongue is found on 50% of true tongue-out frames at
                              # native scale and only 25% at 0.45, monotonically across the sweep
                              # (1.00 > 0.60 > 0.45 > 0.35), while firing on 0-1.3% of no-lick
                              # frames throughout. So it is SPECIFIC, and it simply wants a bigger
                              # input than the nose does. One inference pass per distinct scale;
                              # 312 frames is seconds on the local GPU.
      tongue: 1.0
    min_likelihood: 0.6       # below this the point is left BLANK for manual placement. The donor's
                              # own pcutoff was 0.6 at evaluation.
    never_prelabel: []        # WAS [tongue], on the strength of one overlay where it sat on the
                              # spout. Checking twelve showed most markers at or near the tongue,
                              # biased toward the tongue-spout contact rather than wrong -- and the
                              # lick-onset scoring above showed it discriminates tongue-out from
                              # tongue-in frames cleanly. It is seeded, at its own scale, and
                              # checked like everything else.
                              # THERE IS NO `drop` LIST ANY MORE. It held L_eye/R_eye, because the
                              # donor returns them at 0.44-0.79 in cam4's top corners where there
                              # are no eyes. Now that each camera declares what it can see
                              # (`dlc.cameras.<cam>.bodyparts`), the eyes are simply not columns on
                              # cam4/cam1 and ARE columns on the side views that genuinely show
                              # them -- so the exclusion follows from anatomy rather than from a
                              # second list that could disagree with it.
    spout_from:               # ONE spout replaces two. Take whichever of the donor's two fires
      - L_spout               # harder: which one responds depends on where the moving spout is, and
      - R_spout               # the max-of-two lands at x=255/300/343/346/397/439 px for
                              # far_R/close_R/far_center/close_center/close_L/far_L -- i.e. it
                              # tracks the actual position -- while the nose holds 336-341 px
                              # throughout, as head fixation says it must. 75% of frames >0.6.

  o2:                         # HMS O2 batch inference, ported from the 2pRAM notebook
                              # DeepLabCut/code/20251112_DLC_batch_video_analysis_O2.ipynb
    partition: gpu
    conda_env: deeplabcut
    module: conda/miniforge3/24.11.3-0
    throughput_fps: 86        # MEASURED, not assumed: the old cohort's ~925k-frame videos took
                              # ~3 h each at batchsize 1. At 250 fps a widefield session-camera is
                              # ~1.5M frames, so a WHOLE recording is ~4.8 h of GPU. Inference runs
                              # on cue-aligned windows first (Priya, 2026-09-08) -- ~22% of frames.

epochs:                       # recovery-stage boundary RULES. The per-animal boundaries these
                              # produce live in animals.yaml (fallback) and epoch_boundaries.json
                              # (what the last run actually used). See wfield_local/epochs.py.
  rule_position: far_R        # the spared/affected position both rules are measured at
  acute_fraction: 0.25        # acute = far_R accuracy below this fraction of pre-stroke baseline

  chronic:                    # chronic = BOTH hit rate AND licks/trial stable, on ENGAGED trials.
                              # Not a composite: PS94 sits at 91% hit rate with 45% licking, so the
                              # two measure different things (accuracy vs vigour) and averaging them
                              # hides whichever is worse. Each is tested alone; chronic begins at
                              # the LATER of the two plateaus, and only if both exist.
    min_tail: 3               # sessions required from a candidate start; also the shortest window
    k_sd: 0.3333333333333333  # FLAT: |slope| <= k_sd x that series' own pre-stroke SD, per session.
                              #   Per-series because licking is ~3.5x noisier than hit rate; one
                              #   absolute tolerance makes the lick test ~3.5x stricter and mostly
                              #   reports that licking is noisy (at a fixed 2%/session NO animal
                              #   reaches chronic).
                              #   0.5 WAS REJECTED: it makes permitted drift exactly 1.0 baseline SD
                              #   over the minimum window, which reads better than 0.67, but moves
                              #   PS93 from failing by 55% of tolerance to failing by 3.6% -- one
                              #   session from flipping an animal, on a cohort that gains a session
                              #   most nights.
    k_res: 1.5                # SETTLED: residual scatter about the fit <= k_res x pre-stroke SD.
                              #   A flat FIT through scattered points is a noisy climb: PS95's hit
                              #   rate trends shallowly from day 2 while swinging 72-105%.
    level_min:                # RECOVERED: tail mean, as a fraction of that animal's own baseline.
      hit: 0.90               #   Priya's original by-eye bar; also 1.3-2.0 SD for every animal.
      licks: 0.80             #   looser because licking is noisier; 1.00 would demand full lick
                              #   recovery and reject PS92 at 97%. Flat is NOT recovered -- PS94's
                              #   licking is dead flat at 47% of baseline from day 9.
