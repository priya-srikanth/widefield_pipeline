    # FEWER TRIALS THAN USUAL AND THAT IS CORRECT: 225 cues vs 304-472 for other PS92 sessions.
    # The crash hit after only 24 trials (9.6 min), ~41 min of session went UNRECORDED during the
    # restart, and the second segment then ran 87 min for 201 trials. Verified at both levels --
    # frames: 183276 clean pairs vs 183336 declared in the concat manifest (normal attrition);
    # events: 24 + 201 = 225 exactly. Nothing was lost in the join, the day was simply short.
    # Consequence for analysis: this session has ~half the usual trials, so its per-session decode /
    # encode / RDM estimates are noisier than its siblings' -- weight it accordingly in cross-day
    # comparisons rather than reading a low value as a change in the animal.
    #
    # 8/12 is a CONCATENATION of two acquisitions: the imaging computer crashed mid-session
    # (PS92_20260812_151741, recording_complete=false) and a second was started
    # (PS92_20260812_161728). The imaging box joined them with concat_split_session, keeping the
    # 19742 clean frame-pairs of part 1 (of 29112 recorded) plus all 163594 of part 2 = 183336, and
    # zero-padding the 40.7 min gap so the sample timeline stays wall-clock accurate. The concat
    # folder deliberately carries NO camlog: part 1's is truncated by hundreds of frames, so the
    # .dat + DAQ pco pulses are the authoritative frame record (see the concat manifest beside the
    # .dat). Use the _concat h5, never either segment's own.
